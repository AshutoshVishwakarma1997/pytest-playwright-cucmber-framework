name: Project2 Playwright Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_environment:
        description: Environment to run tests against
        required: true
        default: qa
        type: choice
        options:
          - qa
          - staging
          - production
      headless:
        description: Run browser in headless mode
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  smoke-tests:
    name: Run Project2 smoke tests
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target_environment || 'qa' }}
    env:
      TEST_ENV: ${{ github.event.inputs.target_environment || 'qa' }}
      HEADLESS: ${{ github.event.inputs.headless || 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Run pytest smoke suite headless
        if: env.HEADLESS == 'true'
        run: |
          mkdir -p reports
          python -m pytest -q project2 -m smoke --browser_name chrome --junitxml=reports/project2-smoke.xml

      - name: Run pytest smoke suite headed
        if: env.HEADLESS == 'false'
        run: |
          mkdir -p reports
          xvfb-run -a python -m pytest -q project2 -m smoke --browser_name chrome --junitxml=reports/project2-smoke.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project2-pytest-report
          path: reports/
